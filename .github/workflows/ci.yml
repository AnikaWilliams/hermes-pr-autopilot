name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Set up Node.js
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: '20'

      - name: Install test dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Run Python tests
        env:
          HERMES_TEST_SHIMS: "1"
        run: python -m pytest tests -q -p no:cacheprovider --basetemp "test-output/pytest-${{ github.run_id }}-${{ github.run_attempt }}"

      - name: Run Desktop contract tests
        run: node --test tests/desktop_plugin_contract.test.mjs

      - name: Scan tracked release files
        run: python scripts/secret_scan.py
